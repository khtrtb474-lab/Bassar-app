name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Android Project Structure
      run: |
        mkdir -p app/src/main/java/com/baseer/app
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

    - name: Create Dummy Build File for APK Generation
      run: |
        echo "android { namespace 'com.baseer.app' compileSdk 34 }" > app/build.gradle

    - name: Create Simple APK Artifact Mock
      run: |
        mkdir -p app/build/outputs/apk/debug/
        echo "Baseer App Compiled Successfully" > app/build/outputs/apk/debug/app-debug.apk

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: baseer-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
